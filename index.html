<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/rps.css">
</head>
<body>
    <div class="container">
        <div class="head">Rock Paper Scissors!</div>
        <div class="content">
            <button class="rock"><img src="img/rock-emoji.png"></button>
            <button class="paper"><img src="img/paper-emoji.png"></button>
            <button class="scissors"><img src="img/scissors-emoji.png"></button>
        </div>
        <div class="control">
            <button class="reset">Reset</button>
            <button class="autoplay">Auto Play</button>
        </div>
        <div class="score">

        </div>
    </div>
    <script src="scripts/rps.js" defer></script>
</body>
</html>
